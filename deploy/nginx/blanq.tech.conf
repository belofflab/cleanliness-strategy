# ==========================================================================
# Nginx для Blanq — домен blanq.tech
# Файл: /etc/nginx/sites-available/blanq.tech.conf  (+ symlink в sites-enabled)
#
# Маршрутизация по поддоменам:
#   blanq.tech, www.blanq.tech  -> web (Next.js, 127.0.0.1:3000)
#   api.blanq.tech                 -> api (FastAPI, 127.0.0.1:8000)
#   mail.blanq.tech                -> webmail (Roundcube, 127.0.0.1:8083)
#
# ВАЖНО: конфиг HTTP-only (порт 80) — валиден без SSL-сертификатов и не ломает
# другие сайты на сервере. SSL добавляется автоматически после настройки DNS:
#   sudo certbot --nginx -d blanq.tech -d www.blanq.tech \
#        -d api.blanq.tech -d mail.blanq.tech
# ==========================================================================

upstream pc_web_upstream { server 127.0.0.1:3000; keepalive 32; }
upstream pc_api_upstream { server 127.0.0.1:8000; keepalive 32; }
upstream pc_mail_upstream { server 127.0.0.1:8083; keepalive 16; }

# --- WEB: blanq.tech + www ---
server {
    listen 80;
    listen [::]:80;
    server_name blanq.tech www.blanq.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 25m;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /_next/static/ {
        proxy_pass http://pc_web_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        proxy_pass http://pc_web_upstream;
        proxy_read_timeout 60s;
    }
}

# --- API: api.blanq.tech ---
server {
    listen 80;
    listen [::]:80;
    server_name api.blanq.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 25m;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Контейнер api отдаёт всё под префиксом /api/v1 — проксируем как есть.
    location / {
        proxy_pass http://pc_api_upstream;
        proxy_read_timeout 60s;
    }
}

# --- MAIL (webmail): mail.blanq.tech ---
server {
    listen 80;
    listen [::]:80;
    server_name mail.blanq.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 50m;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://pc_mail_upstream;
        proxy_read_timeout 120s;
    }
}

