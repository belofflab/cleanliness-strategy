; Диалплан SIP-сервера «Точка Чистоты».
;
; Единственный сценарий: входящий звонок от Calltracking (любой набранный
; номер/URI) → звоним на софтфон менеджера 45 секунд. Исходящей маршрутизации
; НЕТ намеренно — сервер не может быть использован для платного фрод-трафика.

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[from-calltracking]
; _. — принимаем любой EXTEN (100, s, номер абонента и т.п.).
exten => _.,1,NoOp(CT call: from ${CALLERID(all)} to ${EXTEN})
 same => n,Answer()
 same => n,Dial(PJSIP/manager,45)
 same => n,Hangup()

[internal]
; Менеджерскому софтфону исходящие через эту АТС не нужны.
exten => _.,1,Hangup()
