# docker-compose платформы PointClean.
# Сервисы: web (Next.js), api (FastAPI), worker+beat (Celery), postgres, redis.
# Запуск из корня репозитория: make up

# Общий блок переменных backend (api, worker, beat) — DRY через YAML-якорь.
x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tochka:tochka@postgres:5432/tochka}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
  # Регионы: город по умолчанию и базовый домен городских поддоменов.
  DEFAULT_CITY_SLUG: ${DEFAULT_CITY_SLUG:-ufa}
  PUBLIC_BASE_DOMAIN: ${PUBLIC_BASE_DOMAIN:-cleanliness.pro}
  # Telegram-пинг операторам о новом лиде (пусто = mock).
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  # Динамический коллтрекинг Calltracking.ru (вебхук звонков).
  CALLTRACKING_WEBHOOK_SECRET: ${CALLTRACKING_WEBHOOK_SECRET:-}
  CALLTRACKING_CITY_NUMBERS: ${CALLTRACKING_CITY_NUMBERS:-}
  # Офлайн-конверсии в Яндекс.Метрику (пусто = mock).
  YANDEX_METRIKA_TOKEN: ${YANDEX_METRIKA_TOKEN:-}
  YANDEX_METRIKA_COUNTER_ID: ${YANDEX_METRIKA_COUNTER_ID:-109824753}
  YANDEX_METRIKA_GOAL_DONE: ${YANDEX_METRIKA_GOAL_DONE:-CleaningDone}
  S3_ENABLED: ${S3_ENABLED:-false}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://storage.yandexcloud.net}
  S3_REGION: ${S3_REGION:-ru-central1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  SMS_ENABLED: ${SMS_ENABLED:-false}
  SMS_RU_API_ID: ${SMS_RU_API_ID:-}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  TOKEN_HMAC_SECRET: ${TOKEN_HMAC_SECRET:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  web:
    build:
      # Контекст — корень монорепо (workspaces); Dockerfile веба в apps/web.
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirror.yandex.ru/mirrors/alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: pc_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirror.yandex.ru/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirror.yandex.ru/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirror.yandex.ru/pypi/web/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirror.yandex.ru}
    image: pointclean-api:latest
    container_name: pc_api
    restart: unless-stopped
    environment: *api-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: pointclean-api:latest
    container_name: pc_worker
    restart: unless-stopped
    # Тот же образ, что и API; запускаем Celery worker.
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: pointclean-api:latest
    container_name: pc_beat
    restart: unless-stopped
    # Планировщик периодических задач (ретраи CRM, синк отзывов, refresh токена).
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    environment: *api-env
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: pc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tochka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tochka}
      POSTGRES_DB: ${POSTGRES_DB:-tochka}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tochka}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
