# Авто-загрузка дашбордов из примонтированной директории.
apiVersion: 1

providers:
  - name: "Точка Чистоты"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
