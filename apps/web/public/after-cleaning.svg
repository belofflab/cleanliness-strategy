<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallAfter" x1="0" y1="0" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFDFF"/>
      <stop offset="1" stop-color="#EAF2FB"/>
    </linearGradient>
    <linearGradient id="floorAfter" x1="0" y1="720" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
