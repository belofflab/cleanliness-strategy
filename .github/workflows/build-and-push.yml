name: CI · Build & Push images (GHCR)

# 1. Проверки (тесты backend с PostgreSQL/Redis, ruff, tsc/eslint web, tsc mobile)
#    — на каждый push и pull request.
# 2. Сборка образов в CI (нормальные ресурсы рунера) и публикация в GHCR —
#    только после зелёных проверок и только на push. Прод НЕ собирает образы
#    у себя (на маленьком сервере npm ci/Next build нестабильны) — он только
#    тянет готовые образы: docker compose pull && up -d.
# 3. Авто-деплой на прод — только на main.

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "apps/mobile/**"
      # Конфиги прода применяются деплоем — без deploy/** в триггерах
      # изменения compose/скриптов не доезжали до сервера (01.09 деплой
      # ротации логов пришлось прогонять вручную).
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-and-push.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Значения NEXT_PUBLIC_* инлайнятся в браузерный бандл на этапе сборки.
  # Переопределяются репозиторными Variables (Settings → Variables) при необходимости.
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://cleanliness.pro' }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.cleanliness.pro/api/v1' }}
  # Скрипт подмены номеров Calltracking.ru (счётчик проекта cleanliness.pro).
  # URL публичный (виден в HTML), поэтому живёт дефолтом прямо здесь;
  # переопределяется репозиторной Variable при смене счётчика.
  NEXT_PUBLIC_CALLTRACKING_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_CALLTRACKING_SCRIPT_URL || 'https://cc.calltracking.ru/phone.d65dd.16710.async.js' }}

jobs:
  # ---------------------------------------------------------------- проверки
  test-api:
    name: test-api (ruff · alembic check · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tochka
          POSTGRES_PASSWORD: tochka
          POSTGRES_DB: tochka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tochka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://tochka:tochka@localhost:5432/tochka
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-only-jwt-secret-never-used-in-production-0123456789
      LOG_JSON: "false"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      # ORM-модели и миграции не должны расходиться (autogenerate = пусто).
      - name: Schema drift check (alembic check)
        run: alembic check

      # Интеграционные тесты идут против сервиса postgres (не skip).
      - name: Tests (pytest)
        run: pytest -q

  check-web:
    name: check-web (eslint · tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: ESLint
        run: npm run lint --workspace apps/web

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/web

      - name: City UI regression check
        run: node apps/web/scripts/city-ui-regression-check.mjs

  check-mobile:
    name: check-mobile (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      # JS-бандлы iOS/Android через Metro: ловит отсутствующие Babel-плагины/модули
      # без нативных тулчейнов (то, что грузит Expo Go).
      - name: Bundle check (expo export)
        run: npx expo export --platform ios --platform android --output-dir .expo/export-check
        env:
          EXPO_PUBLIC_API_URL: https://api.cleanliness.pro/api/v1
          EXPO_PUBLIC_DEFAULT_CITY: ufa

  # ---------------------------------------------------------------- сборка
  build:
    needs: [test-api, check-web, check-mobile]
    # На pull request образы не публикуем — только проверки.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/blanq-tech/clean-comp-api
            context: services/api
            dockerfile: services/api/Dockerfile
          - name: web
            image: ghcr.io/blanq-tech/clean-comp-web
            context: .
            dockerfile: apps/web/Dockerfile
    name: build-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # На рунере используем штатные зеркала (без Yandex), npm-реестр по умолчанию.
          # NEXT_PUBLIC_* нужны только web-образу; api их игнорирует.
          build-args: |
            ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            NPM_REGISTRY=https://registry.npmjs.org/
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CALLTRACKING_SCRIPT_URL=${{ env.NEXT_PUBLIC_CALLTRACKING_SCRIPT_URL }}

  # ---------------------------------------------------------------- деплой
  # Авто-деплой: только на main и только после успешной публикации образов.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ConnectTimeout=15"

          # Деплой запускается на сервере DETACHED (nohup): обрывы SSH-сессии
          # трижды убивали деплой между pull/migrate и up -d. Результат
          # забираем поллингом коротких сессий из лога last-deploy.log.
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            deploy/remote-deploy.sh "$SSH_USER@$SSH_HOST:/tmp/remote-deploy.sh"
          $SSH "$SSH_USER@$SSH_HOST" \
            'nohup bash -c "bash /tmp/remote-deploy.sh; echo \"[deploy] exit=\$?\"" \
             > /opt/clean-comp/deploy/last-deploy.log 2>&1 & echo "[ci] deploy detached, pid $!"'

          for i in $(seq 1 45); do
            sleep 20
            STATUS=$($SSH "$SSH_USER@$SSH_HOST" \
              'grep -o "\[deploy\] exit=[0-9]*" /opt/clean-comp/deploy/last-deploy.log 2>/dev/null | tail -1' || true)
            if [ -n "$STATUS" ]; then
              echo "[ci] $STATUS"
              $SSH "$SSH_USER@$SSH_HOST" 'tail -8 /opt/clean-comp/deploy/last-deploy.log'
              [ "$STATUS" = "[deploy] exit=0" ] && exit 0 || exit 1
            fi
            echo "[ci] deploy in progress… ($((i*20))s)"
          done
          echo "[ci] deploy timed out (15m)"; exit 1
